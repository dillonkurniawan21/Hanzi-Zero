<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanzi Hero | HSK Chinese Learning</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Ma+Shan+Zheng&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.7/dist/hanzi-writer.min.js"></script>
</head>

<body>
    <script>
        (function() {
            if (!localStorage.getItem('hanzi_token')) {
                window.location.href = 'login.html';
            }
        })();
    </script>
    <div id="app">
        <!-- Desktop Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <span class="logo-text">Hanzi Hero</span>
            </div>

            <div class="sidebar-profile">
                <div class="sidebar-profile-name">Hanzi Hero</div>
                <div class="sidebar-profile-level">HSK Level 3</div>
            </div>

            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-screen="home">
                    <span class="icon">🎓</span> <span class="label">Learn</span>
                </a>
                <a href="#" class="nav-item" data-screen="leaderboard">
                    <span class="icon">📊</span> <span class="label">Leaderboard</span>
                </a>
                <a href="#" class="nav-item" data-screen="shop">
                    <span class="icon">🛍️</span> <span class="label">Shop</span>
                </a>
                <a href="#" class="nav-item" data-screen="profile">
                    <span class="icon">👤</span> <span class="label">Profile</span>
                </a>
                <a href="#" class="nav-item" data-screen="more">
                    <span class="icon">•••</span> <span class="label">More</span>
                </a>
                <a href="#" class="nav-item" onclick="localStorage.clear(); window.location.reload();" style="margin-top: auto; color: #ff4d4d;">
                    <span class="nav-icon">🚪</span>
                    <span class="nav-text">Logout</span>
                </a>
            </nav>

            <button class="go-premium-btn">GO PREMIUM</button>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="top-bar">
                <div class="top-spacer"></div>
                <div class="stat-container">
                    <div class="stat-badge coin-badge">
                        <span class="stat-icon coin-icon">💰</span>
                        <span class="value" id="stat-coins">1,240</span>
                    </div>
                    <div class="stat-badge lightning-badge">
                        <span class="stat-icon lightning-icon">⚡</span>
                        <span class="value" id="stat-xp">5</span>
                    </div>
                    <div class="stat-badge heart-badge">
                        <span class="stat-icon heart-icon">🤍</span>
                    </div>
                    <div class="stat-badge avatar-badge">
                        <span class="avatar-icon">🧑‍💼</span>
                    </div>
                </div>
            </header>

            <div class="content-wrapper">
                <section id="screen-container">
                    <!-- Screens will be injected here -->
                </section>
            </div>
        </main>

        <!-- Mobile Bottom Nav -->
        <nav class="mobile-nav">
            <a href="#" class="nav-item active" data-screen="home">🏠</a>
            <a href="#" class="nav-item" data-screen="leaderboard">🏆</a>
            <a href="#" class="nav-item" data-screen="events">✨</a>
            <a href="#" class="nav-item" data-screen="shop">💎</a>
            <a href="#" class="nav-item" data-screen="profile">👤</a>
        </nav>
    </div>

    <!-- Modals / Overlays -->
    <div id="lesson-overlay" class="hidden">
        <div class="lesson-header">
            <button id="close-lesson" class="btn-close">✕</button>
            <div class="progress-bar-container">
                <div id="lesson-progress" class="progress-bar-fill"></div>
            </div>
            <div class="lesson-hearts" id="lesson-hearts-display">❤️ 5</div>
            <div id="quiz-timer" class="hidden"
                style="font-weight: 800; color: var(--accent); background: #ffdfe0; padding: 5px 10px; border-radius: 10px;">
                ⏱️ 15:00</div>
        </div>
        <div class="lesson-tabs">
            <button class="lesson-tab active" data-tab="exercise"
                onclick="switchLessonTab('exercise')">Exercise</button>
            <button class="lesson-tab" data-tab="writing" onclick="switchLessonTab('writing')">Writing</button>
        </div>
        <div id="exercise-container">
            <!-- Exercise content -->
        </div>
        <div id="writing-container" class="hidden">
            <div class="writing-controls">
                <button id="prev-char" class="btn-secondary" onclick="prevWritingChar()">←</button>
                <span id="char-index">1 / 1</span>
                <button id="next-char" class="btn-secondary" onclick="nextWritingChar()">→</button>
            </div>
            <div id="character-target"></div>
            <p id="writing-hint">Draw the character above!</p>
        </div>
        <div class="lesson-footer">
            <div id="feedback-area" class="feedback-hidden">
                <div class="feedback-content">
                    <div class="feedback-icon"></div>
                    <div class="feedback-text">
                        <h3 class="feedback-title">Correct!</h3>
                        <p class="feedback-sub"></p>
                    </div>
                </div>
                <button id="next-btn" class="btn-primary">CONTINUE</button>
            </div>
            <button id="check-btn" class="btn-primary">CHECK</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="writing_quiz.js"></script>
    <script src="Promotion.js"></script>
    <script src="app.js"></script>
    <script src="augment_lessons.js"></script>
    <script src="AiTutor.js"></script>
</body>

</html>
